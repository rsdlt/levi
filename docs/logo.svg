<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="levi: two crossed blades over a git commit graph">
  <title>levi</title>
  <defs>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f3f6fa"/>
      <stop offset="0.5" stop-color="#c7d0dc"/>
      <stop offset="1" stop-color="#8e9aab"/>
    </linearGradient>
    <linearGradient id="hilt" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6b7a90"/>
      <stop offset="1" stop-color="#46536a"/>
    </linearGradient>
  </defs>

  <!-- The commit graph behind: a main line through the crossing, and a branch
       arcing up through the open V between the blades, then merging back. -->
  <g stroke="#22b8cf" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 18 104 L 182 104"/>
    <path d="M 42 104 C 62 104, 74 52, 100 52 S 138 104, 158 104"/>
  </g>
  <g fill="#22b8cf" stroke="#0e5f6b" stroke-width="2.5">
    <circle cx="26" cy="104" r="8"/>
    <circle cx="100" cy="52" r="8"/>
    <circle cx="174" cy="104" r="8"/>
  </g>

  <!-- The crossed blades on top. -->
  <g transform="translate(100 108) rotate(-32)">
    <path d="M -4.5 22 L -4.5 -96 L 4.5 -108 L 4.5 22 Z" fill="url(#steel)" stroke="#2b3340" stroke-width="2" stroke-linejoin="round"/>
    <!-- Snap-off score lines, parallel to the tip. -->
    <path d="M -4.5 -80 L 4.5 -92 M -4.5 -64 L 4.5 -76 M -4.5 -48 L 4.5 -60 M -4.5 -32 L 4.5 -44 M -4.5 -16 L 4.5 -28 M -4.5 0 L 4.5 -12 M -4.5 16 L 4.5 4" stroke="#7d8a9c" stroke-width="1.2"/>
    <!-- The cutting edge catches the light. -->
    <path d="M 3 18 L 3 -104" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <!-- Knuckle guard: a bar from the front of the hilt down to the grip's end. -->
    <path d="M 7 26 C 15 34, 15 58, 9 70" stroke="#2b3340" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 7 26 C 15 34, 15 58, 9 70" stroke="#6b7a90" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Hilt block where the blade seats. -->
    <rect x="-8" y="21" width="16" height="15" rx="2" fill="url(#hilt)" stroke="#2b3340" stroke-width="2"/>
    <!-- Grip, angled back a little, with a trigger in front. -->
    <path d="M -6 36 L 5 36 L 7 70 L -3 70 Z" fill="#3c475a" stroke="#2b3340" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -4 44 L 5 44 M -3 52 L 6 52 M -2 60 L 6 60" stroke="#2b3340" stroke-width="1.3"/>
    <path d="M 5 39 C 10 40, 10 46, 6 47" fill="none" stroke="#2b3340" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="2" cy="72" r="3.5" fill="#6b7a90" stroke="#2b3340" stroke-width="1.8"/>
  </g>
  <g transform="translate(100 108) scale(-1 1) rotate(-32)">
    <path d="M -4.5 22 L -4.5 -96 L 4.5 -108 L 4.5 22 Z" fill="url(#steel)" stroke="#2b3340" stroke-width="2" stroke-linejoin="round"/>
    <!-- Snap-off score lines, parallel to the tip. -->
    <path d="M -4.5 -80 L 4.5 -92 M -4.5 -64 L 4.5 -76 M -4.5 -48 L 4.5 -60 M -4.5 -32 L 4.5 -44 M -4.5 -16 L 4.5 -28 M -4.5 0 L 4.5 -12 M -4.5 16 L 4.5 4" stroke="#7d8a9c" stroke-width="1.2"/>
    <!-- The cutting edge catches the light. -->
    <path d="M 3 18 L 3 -104" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <!-- Knuckle guard: a bar from the front of the hilt down to the grip's end. -->
    <path d="M 7 26 C 15 34, 15 58, 9 70" stroke="#2b3340" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 7 26 C 15 34, 15 58, 9 70" stroke="#6b7a90" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Hilt block where the blade seats. -->
    <rect x="-8" y="21" width="16" height="15" rx="2" fill="url(#hilt)" stroke="#2b3340" stroke-width="2"/>
    <!-- Grip, angled back a little, with a trigger in front. -->
    <path d="M -6 36 L 5 36 L 7 70 L -3 70 Z" fill="#3c475a" stroke="#2b3340" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -4 44 L 5 44 M -3 52 L 6 52 M -2 60 L 6 60" stroke="#2b3340" stroke-width="1.3"/>
    <path d="M 5 39 C 10 40, 10 46, 6 47" fill="none" stroke="#2b3340" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="2" cy="72" r="3.5" fill="#6b7a90" stroke="#2b3340" stroke-width="1.8"/>
  </g>
</svg>
