[package]
name = "levi-git"
version = "0.11.0"
edition = "2024"
description = "A git diff viewer: commits, their files and diffs, with fzf-style search"
license = "MIT"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/rsdlt/levi"
keywords = ["git", "diff", "tui", "fuzzy", "terminal"]
categories = ["command-line-utilities", "development-tools"]

# The crate is levi-git (levi was taken on crates.io); the command is levi.
[[bin]]
name = "levi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"

[dev-dependencies]
tempfile = "3.27.0"
