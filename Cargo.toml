[package]
name = "levi-git"
version = "0.16.0"
edition = "2024"
description = "A git diff viewer: commits, their files and diffs, with fzf-style search"
license = "MIT"
rust-version = "1.88"
readme = "README.md"
# What the crate ships: the code, its tests and the docs crates.io shows. A list
# of what goes in, so a stray file in the working tree never ends up published.
# The demo GIF stays on GitHub; crates.io loads it from the repository.
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
repository = "https://github.com/rsdlt/levi"
keywords = ["git", "diff", "tui", "fuzzy", "terminal"]
categories = ["command-line-utilities", "development-tools"]

# The crate is levi-git (levi was taken on crates.io); the command is levi.
[[bin]]
name = "levi"
path = "src/main.rs"

# `cargo binstall levi-git` downloads the archives the release workflow builds.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/levi-{ version }-{ target }{ archive-suffix }"
bin-dir = "levi-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.104"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.190"
