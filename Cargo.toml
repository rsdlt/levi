[package]
name = "levi-git"
version = "0.11.2"
edition = "2024"
description = "A git diff viewer: commits, their files and diffs, with fzf-style search"
license = "MIT"
rust-version = "1.88"
readme = "README.md"
# The demo is for GitHub and crates.io pages, which load it from the repository.
exclude = ["docs/demo.gif", "docs/demo.tape"]
repository = "https://github.com/rsdlt/levi"
keywords = ["git", "diff", "tui", "fuzzy", "terminal"]
categories = ["command-line-utilities", "development-tools"]

# The crate is levi-git (levi was taken on crates.io); the command is levi.
[[bin]]
name = "levi"
path = "src/main.rs"

# `cargo binstall levi-git` downloads the archives the release workflow builds.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/levi-{ version }-{ target }{ archive-suffix }"
bin-dir = "levi-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.104"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"

[dev-dependencies]
tempfile = "3.27.0"
